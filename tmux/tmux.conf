set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-overrides "tmux-256color:Tc,xterm-256color:Tc,wezterm:Tc,xterm-kitty:Tc,alacritty:Tc,xterm-kitty:keyboard"

set -g set-clipboard on
set -g detach-on-destroy on
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3
set -g allow-passthrough on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# Prefix
unbind C-b
set -g prefix C-a

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Rename
unbind \;
bind \; display-popup -w 40 -h 3 -E "printf 'Session name: ' && read -r name && tmux rename-session \"\$name\""
unbind \'
bind \' display-popup -w 40 -h 3 -E "printf 'Window name: ' && read -r name && tmux rename-window \"\$name\""

# Window
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window

# Session
unbind ,
unbind .
unbind \(
unbind \)
bind , switch-client -p
bind . switch-client -n

# Panes
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind -T root j if -F "#{==:#{pane_mode},tree-mode}" "send h" "send j"
bind -T root k if -F "#{==:#{pane_mode},tree-mode}" "send j" "send k"
bind -T root l if -F "#{==:#{pane_mode},tree-mode}" "send l" "send l"
bind -T root i if -F "#{==:#{pane_mode},tree-mode}" "send k" "send i"
bind -T root w if -F "#{==:#{pane_mode},tree-mode}" "" "send w"

bind i select-pane -U
bind j select-pane -L
bind k select-pane -D
bind l select-pane -R

bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

bind -r m resize-pane -Z

bind -n M-Up swap-pane -s '{up-of}'
bind -n M-Down swap-pane -s '{down-of}'
bind -n M-Left swap-pane -s '{left-of}'
bind -n M-Right swap-pane -s '{right-of}'

# Copy mode
set-window-option -g mode-keys vi

unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l

bind -T copy-mode-vi i send -X cursor-up
bind -T copy-mode-vi j send -X cursor-left
bind -T copy-mode-vi k send -X cursor-down
bind -T copy-mode-vi l send -X cursor-right

bind -T copy-mode-vi 'v' send -X begin-selection

bind P paste-buffer

unbind -T copy-mode-vi MouseDragEnd1Pane

# Kill
unbind x
bind x display-menu -T " Kill pane #P? " -x C -y C \
  "No"  n "" \
  "Yes" y "kill-pane"
bind C-x display-menu -T " Kill window #W? " -x C -y C \
  "No"  n "" \
  "Yes" y "kill-window"
bind C-q display-menu -T " Kill session #S? " -x C -y C \
  "No"  n "" \
  "Yes" y "kill-session"

# Open URLs
bind C-u run-shell -b "tmux capture-pane -J -p | grep -oE 'https?://[^[:space:]\"<>]+' | sed \"s/[').,;:]*$//\" | sort -u | fzf-tmux -p50%,50% --preview '' --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"

# TMP plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info

# Status style
set -g status-position top
set -g mode-style "fg=#82aaff,bg=#3b4261"
set -g message-style "fg=#82aaff,bg=#3b4261"
set -g message-command-style "fg=#82aaff,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#82aaff,bg=default"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#1b1d2b,bg=#82aaff,bold] #S #[fg=#82aaff,bg=default,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1e2030,bg=default,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=default] #{prefix_highlight} #[fg=#3b4261,bg=default,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] #{s|^$HOME|~|:pane_current_path}   #{cpu}   #{mem}"

setw -g window-status-activity-style "underscore,fg=#828bb8,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=default"
setw -g window-status-format "#[fg=#1e2030,bg=default,nobold,nounderscore,noitalics]#[default] #I   #W #F #[fg=#1e2030,bg=default,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold] #I   #W #F #[fg=#3b4261,bg=default,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg=#ffc777]#[bg=default]#[fg=#1e2030]#[bg=#ffc777]"
set -g @prefix_highlight_output_suffix ""
set -g @resurrect-capture-pane-contents 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && echo cloning'"
run '~/.tmux/plugins/tpm/tpm'
