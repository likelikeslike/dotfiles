"$schema" = "https://starship.rs/config-schema.json"

format = """
$os\
$directory\
$git_branch\
$git_status
"""


follow_symlinks = true
palette         = "tokyonight_moon"

[palettes.tokyonight_moon]
deep_indigo   = '#222436'
midnight      = '#1e2030'
slate_purple  = '#2f334d'
obsidian      = '#1b1d2b'
soft_lavender = '#c8d3f5'
dusty_blue    = '#828bb8'
muted_blue    = '#636da6'
steel_gray    = '#3b4261'
periwinkle    = '#82aaff'
sky_cyan      = '#86e1fc'
spring_green  = '#c3e88d'
lilac         = '#c099ff'
tangerine     = '#ff966c'
salmon        = '#ff757f'
amber         = '#ffc777'
pink_orchid   = '#fca7ea'
cobalt        = '#3e68d7'
azure         = '#65bcff'
electric_cyan = '#0db9d7'
ice_blue      = '#89ddff'
seafoam       = '#4fd6be'
teal          = '#41a6b5'
mint_green    = '#4fd6be'
aqua          = '#b4f9f8'


[directory]
disabled                  = false
format                    = "[$path ]($style)([$read_only ]($read_only_style))"
style                     = "bold fg:periwinkle"
read_only_style           = "pink_orchid"
home_symbol               = "~"
read_only                 = "󰌾"
truncation_symbol         = "…/"
truncation_length         = 3
truncate_to_repo          = false
fish_style_pwd_dir_length = 0
use_logical_path          = true

  [directory.substitutions]
  "Documents" = "󰈙"
  "Downloads" = " "
  "Music"     = " "
  "Pictures"  = " "


[git_branch]
disabled           = false
format             = "on [$symbol$branch]($style) "
style              = "bold electric_cyan"
symbol             = " "
truncation_length  = 9223372036854775807
truncation_symbol  = "…"
only_attached      = false
always_show_remote = false
ignore_branches    = []


[git_status]
disabled          = false
format            = "[$all_status$ahead_behind]($style)"
style             = "pink_orchid"
stashed           = "\\$"
ahead             = "⇡"
behind            = "⇣"
up_to_date        = ""
diverged          = "⇕"
conflicted        = "x"
deleted           = "-"
renamed           = "»"
modified          = "!"
staged            = "+"
untracked         = "?"
typechanged       = ""
ignore_submodules = false


[os]
disabled = false
format   = "[$symbol]($style) "
style    = "bold periwinkle"

  [os.symbols]
  Linux    = " "
  Macos    = " "
  Raspbian = " "
  Ubuntu   = "󰕈 "
  Unknown  = " "
  Windows  = " "


